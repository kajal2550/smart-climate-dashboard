version: '3.9'

# ── Jenkins CI/CD Server ──────────────────────────────────────────────────────
# Usage:
#   docker compose -f docker-compose.jenkins.yml up -d
#   Open: http://localhost:8080
#   Get initial admin password:
#     docker exec climate-jenkins cat /var/jenkins_home/secrets/initialAdminPassword

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: climate-jenkins
    restart: unless-stopped
    privileged: true
    user: root
    ports:
      - "8080:8080"     # Jenkins Web UI
      - "50000:50000"   # Jenkins agent port
    volumes:
      # Persist Jenkins data (jobs, plugins, credentials)
      - jenkins_home:/var/jenkins_home
      # Mount Docker socket so Jenkins can run Docker commands
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount Docker binary so Jenkins can use docker CLI
      - /usr/bin/docker:/usr/bin/docker
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - JENKINS_OPTS=--prefix=/
    networks:
      - jenkins-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Jenkins Agent (optional — for distributed builds) ─────────────────────
  jenkins-agent:
    image: jenkins/inbound-agent:latest
    container_name: climate-jenkins-agent
    restart: unless-stopped
    depends_on:
      jenkins:
        condition: service_healthy
    environment:
      - JENKINS_URL=http://jenkins:8080
      - JENKINS_AGENT_NAME=docker-agent
      - JENKINS_SECRET=${JENKINS_AGENT_SECRET:-changeme}
      - JENKINS_AGENT_WORKDIR=/home/jenkins/agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent_workdir:/home/jenkins/agent
    networks:
      - jenkins-net

volumes:
  jenkins_home:
    driver: local
  agent_workdir:
    driver: local

networks:
  jenkins-net:
    driver: bridge
